[package]
name    = "aegis-installer"
version = "0.1.0"
edition = "2021"
description = "AegisRescue installer wizard — language, license, component selection, disk install"
license = "GPL-3.0"

[[bin]]
name = "aegis-installer"
path = "src/main.rs"

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
aegis-common = { path = "../../core/aegis-common" }
tauri        = { version = "1", features = ["api-all"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
tokio        = { version = "1", features = ["full"] }
anyhow       = "1"
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono       = { version = "0.4", features = ["serde"] }

[build-dependencies]
tauri-build = { version = "1", features = [] }
