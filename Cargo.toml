[workspace]
resolver = "2"
members = [
    "core/aegis-common",
    "core/aegisd",
    "core/aegis-mount",
    "core/aegis-scan",
    "core/aegis-recover",
    "core/aegis-boot",
    "core/aegis-forensic",
    "core/aegis-image",
    "core/aegis-ai",
    "core/aegis-sandbox",
    "core/aegis-cli",
    "core/aegis-preflight",
    "core/aegis-update",
]

[workspace.dependencies]
tokio        = { version = "1", features = ["full"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
toml         = "0.8"
anyhow       = "1"
thiserror    = "1"
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap         = { version = "4", features = ["derive", "env"] }
sha2         = "0.10"
blake3       = "1"
hex          = "0.4"
chrono       = { version = "0.4", features = ["serde"] }
uuid         = { version = "1", features = ["v4", "serde"] }
nix          = { version = "0.29", features = ["fs", "mount", "process", "signal", "ioctl"] }
libc         = "0.2"
goblin       = "0.8"
rusqlite     = { version = "0.31", features = ["bundled"] }
walkdir      = "2"
tempfile     = "3"
regex        = "1"
rayon        = "1"
indicatif    = "0.17"
dialoguer    = "0.11"
console      = "0.15"
zstd         = "0.13"

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
strip         = true
panic         = "abort"

[profile.dev]
opt-level = 0
debug     = true
