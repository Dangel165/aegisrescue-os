# AegisRescue 기본 보안 정책
# 경로: /etc/aegis/policy.toml

[mount]
# 기본 마운트 모드: "ro" = 읽기 전용 (변경 금지)
default_mode = "ro"
# 기본 마운트 옵션
default_options = ["noexec", "nodev", "nosuid"]
# RW 마운트 전 사용자 확인 필요
require_confirmation_for_rw = true
# 쓰기 시 자동 COW 스냅샷 생성
auto_snapshot_on_write = true
# 감염 의심 디스크 자동 RO 강제
force_ro_on_suspicious = true

[network]
# 기본 네트워크 모드: "airgap" = 완전 차단
# 옵션: "airgap" | "whitelist" | "restricted" | "full"
default = "airgap"
# 업데이트 서버 화이트리스트 허용 여부
allow_update_whitelist = false
# 허용 호스트 목록 (whitelist 모드)
allowed_hosts = []

[scan]
# 활성화할 탐지 엔진 목록
engines = ["signature", "heuristic", "yara", "ai", "ioc"]
# 악성 판정 임계값 (0.0 ~ 1.0)
malicious_threshold = 0.85
# 의심 판정 임계값
suspicious_threshold = 0.50
# 스캔 제외 경로
exclude_paths = []
# 최대 파일 크기 (MB, 0 = 무제한)
max_file_size_mb = 512

[forensic]
# 소프트웨어 쓰기 차단기 강제
write_blocker = true
# 해시 알고리즘: "sha256" | "sha512" | "blake3"
hash_algorithm = "sha256"
# 체인 오브 커스터디 로깅
chain_of_custody = true
# 증거 저장 기본 경로
evidence_path = "/mnt/evidence"

[integrity]
# Secure Boot 미활성 시 경고 (but 부팅 허용 — 복구 목적)
require_secure_boot = false
# 루트 FS dm-verity 검증
verify_root_dmverity = true
# 서명된 커널 모듈만 허용
module_signature_required = true

[quarantine]
# 격리 저장소 경로
quarantine_path = "/var/lib/aegis/quarantine"
# 격리 파일 암호화
encrypt_quarantine = true
# 격리 보관 최대 일수 (0 = 무제한)
retention_days = 30

[sandbox]
# 기본 격리 레벨: 0=정적, 1=네임스페이스, 2=VM
default_level = 1
# VM 격리 시 메모리 할당 (MiB)
vm_memory_mib = 256
# 분석 타임아웃 (초)
timeout_secs = 60
