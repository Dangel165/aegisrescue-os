[package]
name    = "aegiscenter"
version = "0.1.0"
edition = "2021"
description = "AegisCenter — AegisRescue GUI backend (Tauri)"
license = "GPL-3.0"

[[bin]]
name = "aegiscenter"
path = "src/main.rs"

[dependencies]
aegis-common = { path = "../../core/aegis-common" }
tauri        = { version = "1", features = ["api-all", "custom-protocol"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
tokio        = { version = "1", features = ["full"] }
anyhow       = "1"
tracing      = "0.1"

[build-dependencies]
tauri-build = { version = "1", features = [] }
