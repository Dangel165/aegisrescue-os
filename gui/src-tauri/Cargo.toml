[package]
name    = "aegiscenter"
version = "0.1.0"
edition = "2021"
description = "AegisCenter — AegisRescue GUI backend (Tauri)"
license = "GPL-3.0"

[[bin]]
name = "aegiscenter"
path = "src/main.rs"

[dependencies]
aegis-common = { path = "../../core/aegis-common" }
tauri        = { version = "1", features = ["api-all"] }
serde        = { workspace = true }
serde_json   = { workspace = true }
tokio        = { workspace = true }
anyhow       = { workspace = true }
tracing      = { workspace = true }

[build-dependencies]
tauri-build = { version = "1", features = [] }
