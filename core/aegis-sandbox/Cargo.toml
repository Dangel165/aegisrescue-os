[package]
name    = "aegis-sandbox"
version = "0.1.0"
edition = "2021"
description = "AegisRescue sandbox launcher — namespace + seccomp + microVM isolation"
license = "GPL-3.0"

[[bin]]
name = "aegis-sandbox"
path = "src/main.rs"

[dependencies]
aegis-common = { path = "../aegis-common" }
aegis-ai     = { path = "../aegis-ai" }
tokio        = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
anyhow       = { workspace = true }
thiserror    = { workspace = true }
tracing      = { workspace = true }
tracing-subscriber = { workspace = true }
clap         = { workspace = true }
nix          = { workspace = true }
libc         = { workspace = true }
uuid         = { workspace = true }
