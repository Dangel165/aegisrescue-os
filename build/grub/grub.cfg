# AegisRescue GRUB 부트 설정
# =====================================================================

set default=0
set timeout=15
set timeout_style=menu

# ─── 해상도 / 폰트 / 테마 ────────────────────────────────────
set gfxmode=1024x768,auto
insmod all_video
insmod gfxterm
insmod png
terminal_output gfxterm
if loadfont /boot/grub/fonts/unicode.pf2; then
    insmod gfxmenu
    if [ -f /boot/grub/themes/aegis/theme.txt ]; then
        set theme=/boot/grub/themes/aegis/theme.txt
        export theme
    fi
fi

set color_normal=light-gray/black
set color_highlight=white/dark-gray
set menu_color_normal=light-gray/black
set menu_color_highlight=white/dark-gray

# ─── 배경 이미지 (있을 경우) ─────────────────────────────────
if background_image /boot/grub/aegis-bg.png; then
    true
fi

# ─── 기본 부팅 파라미터 ──────────────────────────────────────
# Shared live boot params (keep in sync with build/configure-live-console.sh LIVE_KERNEL_BASE)
set live_common="boot=live components live-media-path=/live console=tty1"
set live_safe="boot=live components live-media-path=/live nomodeset xdriver=vesa console=tty1"
set live_gui="${live_common} splash quiet"
set live_cli="${live_safe} aegis.cli=1 systemd.unit=multi-user.target plymouth.enable=0"

set cmdline_base="${live_gui}"
set cmdline_cli="${live_cli}"
set cmdline_forensic="${live_safe} aegis.mode=forensic noswap aegis.cli=1 systemd.unit=multi-user.target plymouth.enable=0 readonly nopersistence"
set cmdline_airgap="${live_safe} aegis.mode=airgap aegis.cli=1 systemd.unit=multi-user.target plymouth.enable=0"
set cmdline_toram="${live_gui} toram"
set cmdline_debug="${live_common} debug verbose systemd.log_level=debug aegis.debug=1"

# ─── 메뉴 항목 ───────────────────────────────────────────────

menuentry "AegisRescue Linux — Live (GUI + Installer)" \
    --class aegis --class linux --id live {
    set gfxpayload=keep
    linux   /boot/vmlinuz ${cmdline_base}
    initrd  /boot/initramfs.img
}

menuentry "AegisRescue — CLI Mode  [Text Console]" \
    --class aegis --class linux --id cli {
    set gfxpayload=keep
    linux   /boot/vmlinuz ${cmdline_cli}
    initrd  /boot/initramfs.img
}
menuentry "AegisRescue — Forensic Mode  [CLI]" \
    --class aegis --class forensic --id forensic {
    set gfxpayload=keep
    linux   /boot/vmlinuz ${cmdline_forensic}
    initrd  /boot/initramfs.img
}

menuentry "AegisRescue — Network Isolated  [Air-Gap CLI]" \
    --class aegis --class security --id airgap {
    set gfxpayload=keep
    linux   /boot/vmlinuz ${cmdline_airgap}
    initrd  /boot/initramfs.img
}

menuentry "AegisRescue — RAM Boot  [Copy to RAM, USB-Safe]" \
    --class aegis --id toram {
    set gfxpayload=keep
    linux   /boot/vmlinuz ${cmdline_toram}
    initrd  /boot/initramfs.img
}

submenu "고급 부팅 옵션 ▶" --class advanced {

    menuentry "Safe Graphics (nomodeset)" \
        --class aegis --id safegfx {
        linux  /boot/vmlinuz ${live_safe} splash quiet
        initrd /boot/initramfs.img
    }

    menuentry "디버그 모드 (verbose)" \
        --class aegis --id debug {
        linux  /boot/vmlinuz ${cmdline_debug}
        initrd /boot/initramfs.img
    }

    menuentry "Accessibility — Screen Reader" \
        --class aegis --id access {
        linux  /boot/vmlinuz ${live_gui} access=v3
        initrd /boot/initramfs.img
    }

    menuentry "Secure Boot Check" \
        --class aegis --id secureboot {
        linux  /boot/vmlinuz ${live_gui} aegis.mode=live aegis.secureboot_check=1
        initrd /boot/initramfs.img
    }
}

submenu "설치 ▶" --class install {

    menuentry "AegisRescue를 디스크에 설치" \
        --class install --id install {
        linux  /boot/vmlinuz ${live_gui} aegis.install=1
        initrd /boot/initramfs.img
    }

    menuentry "USB에 AegisRescue 설치" \
        --class install --id install-usb {
        linux  /boot/vmlinuz ${live_gui} aegis.install=1 aegis.install_target=usb
        initrd /boot/initramfs.img
    }
}

menuentry "메모리 테스트 (memtest86+)" \
    --class memtest --id memtest {
    linux16 /boot/memtest86+
}

menuentry "첫 번째 하드디스크에서 부팅" \
    --class hdd --id harddisk {
    set root=(hd0)
    chainloader +1
}
