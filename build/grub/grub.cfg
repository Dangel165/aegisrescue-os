# AegisRescue GRUB v6 — Ubuntu-style labels, classic menu (always readable)
# =====================================================================

set default=0
set timeout=30
set timeout_style=menu

set theme=
unset theme

if [ "${grub_platform}" = "efi" ]; then
    insmod efi_gop
fi

insmod gfxterm
insmod iso9660
insmod search
insmod search_fs_file

terminal_output gfxterm
set gfxmode=auto
set gfxpayload=keep

if [ -f ${prefix}/fonts/unicode.pf2 ]; then
    loadfont ${prefix}/fonts/unicode.pf2
fi

background_color black
set color_normal=light-gray/black
set color_highlight=white/blue
set menu_color_normal=light-gray/black
set menu_color_highlight=black/white

if [ "${grub_platform}" = "efi" ]; then
    search --no-floppy --set=root --file /boot/vmlinuz
fi

# nosplash + plymouth.enable=0 — prevents blurry full-screen splash after boot
set live_common="boot=live components live-media-path=/live console=tty1"
set live_safe="boot=live components live-media-path=/live nomodeset xdriver=vesa console=tty1"
set live_gui="${live_safe} plymouth.enable=0 systemd.unit=graphical.target"
set live_cli="${live_safe} aegis.cli=1 systemd.unit=multi-user.target plymouth.enable=0"

set cmdline_try="${live_gui}"
set cmdline_cli="${live_cli}"
set cmdline_forensic="${live_safe} aegis.mode=forensic noswap aegis.cli=1 systemd.unit=multi-user.target plymouth.enable=0 readonly nopersistence"
set cmdline_airgap="${live_safe} aegis.mode=airgap aegis.cli=1 systemd.unit=multi-user.target plymouth.enable=0"
set cmdline_toram="${live_gui} toram"
set cmdline_debug="${live_safe} plymouth.enable=0 debug verbose systemd.log_level=debug aegis.debug=1"

menuentry "Try AegisRescue (Live)" --class gnu-linux --id live {
    linux   /boot/vmlinuz ${cmdline_try}
    initrd  /boot/initramfs.img
}

menuentry "AegisRescue (safe graphics)" --class gnu-linux --id safegfx {
    linux   /boot/vmlinuz ${live_safe} plymouth.enable=0 systemd.unit=graphical.target
    initrd  /boot/initramfs.img
}

menuentry "AegisRescue (CLI text mode)" --class gnu-linux --id cli {
    linux   /boot/vmlinuz ${cmdline_cli}
    initrd  /boot/initramfs.img
}

submenu "Advanced options for AegisRescue" {

    menuentry "AegisRescue, forensic mode" {
        linux  /boot/vmlinuz ${cmdline_forensic}
        initrd /boot/initramfs.img
    }

    menuentry "AegisRescue, air-gapped mode" {
        linux  /boot/vmlinuz ${cmdline_airgap}
        initrd /boot/initramfs.img
    }

    menuentry "AegisRescue, copy to RAM (toram)" {
        linux  /boot/vmlinuz ${cmdline_toram}
        initrd /boot/initramfs.img
    }

    menuentry "AegisRescue, with debug logging" {
        linux  /boot/vmlinuz ${cmdline_debug}
        initrd /boot/initramfs.img
    }
}

submenu "Install AegisRescue" {

    menuentry "Install AegisRescue to disk" {
        linux  /boot/vmlinuz ${cmdline_try} aegis.install=1
        initrd /boot/initramfs.img
    }

    menuentry "Install AegisRescue to USB" {
        linux  /boot/vmlinuz ${cmdline_try} aegis.install=1 aegis.install_target=usb
        initrd /boot/initramfs.img
    }
}

menuentry "Memory test (memtest86+)" {
    linux16 /boot/memtest86+
}

menuentry "Boot from next volume" {
    if [ "${grub_platform}" = "efi" ]; then
        insmod fwsetup
        fwsetup
    else
        set root=(hd0)
        chainloader +1
    fi
}
