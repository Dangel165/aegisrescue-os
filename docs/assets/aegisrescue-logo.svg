<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">AegisRescue OS logo</title>
  <desc id="desc">Black boot-style AegisRescue logo with a silver shield monogram.</desc>
  <defs>
    <linearGradient id="metal" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f2f2f2"/>
      <stop offset="0.25" stop-color="#9a9a9a"/>
      <stop offset="0.5" stop-color="#d8d8d8"/>
      <stop offset="0.75" stop-color="#666666"/>
      <stop offset="1" stop-color="#eeeeee"/>
    </linearGradient>
    <linearGradient id="darkMetal" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#c8c8c8"/>
      <stop offset="0.5" stop-color="#343434"/>
      <stop offset="1" stop-color="#a8a8a8"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="#000000"/>
  <radialGradient id="glow" cx="50%" cy="45%" r="55%">
    <stop offset="0" stop-color="#161616"/>
    <stop offset="0.55" stop-color="#050505"/>
    <stop offset="1" stop-color="#000000"/>
  </radialGradient>
  <rect width="1200" height="675" fill="url(#glow)"/>

  <g transform="translate(600 250)" filter="url(#softShadow)">
    <path d="M0-145 172-70v128c0 92-71 162-172 204C-101 220-172 150-172 58V-70Z"
          fill="none" stroke="url(#metal)" stroke-width="28" stroke-linejoin="round"/>

    <path d="M-174 108-42-150H38L178 108h-78L22-56-56 108Z"
          fill="url(#metal)"/>
    <path d="M-34 26H78c33 0 55-18 55-48 0-29-22-47-55-47H28l38-69h20c76 0 127 46 127 116 0 68-51 116-127 116H-34Z"
          fill="url(#darkMetal)"/>

    <path d="M-30 36 28-22v35h96v47H28v35Z"
          fill="#050505"/>
    <path d="M-30 36 28-22v35h96v47H28v35Z"
          fill="none" stroke="#cfcfcf" stroke-width="6" stroke-linejoin="round" opacity="0.85"/>
  </g>

  <g text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="600" y="535" fill="#d6d6d6" font-size="46" font-weight="600" letter-spacing="18">AEGISRESCUE</text>
    <line x1="430" y1="575" x2="535" y2="575" stroke="#5d5d5d" stroke-width="3"/>
    <text x="600" y="587" fill="#b8b8b8" font-size="28" font-weight="600" letter-spacing="10">OS</text>
    <line x1="665" y1="575" x2="770" y2="575" stroke="#5d5d5d" stroke-width="3"/>
  </g>
</svg>
